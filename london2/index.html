:root{color-scheme:dark}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:24px 16px;box-sizing:border-box;
background:linear-gradient(180deg,#0a0806 35%,#c25a1a 100%);color:#faf4ea;font:16px/1.4 -apple-system,Inter,Helvetica,Arial,sans-serif;text-align:center}

<img src="https://i.ytimg.com/vi/8bQayLutces/maxresdefault.jpg" alt="">
<div>A Day in the Life of a Poker Pro in London, Part 2</div>
<a class="btn" id="go" href="https://www.youtube.com/watch?v=8bQayLutces">▶ Open in YouTube</a>
<small>Opening the YouTube app…</small>
<script>
(function(){
  var id="8bQayLutces", web="https://www.youtube.com/watch?v="+id, ua=navigator.userAgent, app;
  if(/android/i.test(ua)){
    app="intent://www.youtube.com/watch?v="+id+"#Intent;scheme=https;package=com.google.android.youtube;S.browser_fallback_url="+encodeURIComponent(web)+";end";
  }else if(/iphone|ipad|ipod/i.test(ua)){
    app="youtube://www.youtube.com/watch?v="+id;
  }
  if(!app){location.replace(web);return}
  document.getElementById("go").href=app;
  location.href=app;
  // still here after 2.5 s = app not installed: open YouTube on the web
  setTimeout(function(){ if(!document.hidden) location.href=web; },2500);
})();
</script>
</body></html>
