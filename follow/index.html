<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow Alexis Lahire</title>
<meta property="og:title" content="Follow Alexis Lahire">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px 16px;
background:linear-gradient(180deg,#060607 0%,#0b0a0a 48%,#4a2410 82%,#e8812a 118%);color:#f6f2ec;font:500 16px/1.4 Inter,-apple-system,Helvetica,Arial,sans-serif;text-align:center}
h1{margin:0 0 18px;font-size:28px;font-weight:600;letter-spacing:-.02em}
a.btn{display:block;width:100%;max-width:320px;padding:17px 24px;border-radius:999px;color:#fff;text-decoration:none;font-weight:600;font-size:17px;
background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
a.btn:active{background:rgba(255,197,118,.3)}
</style></head><body>
<h1>Follow Alexis Lahire</h1>
<a class="btn" id="tt" href="https://www.tiktok.com/@alexislahire0">Follow on TikTok</a>
<a class="btn" id="x" href="https://x.com/alexislahire">Follow on X</a>
<script>
(function(){
  // Instagram's in-app browser can't follow anyone: leave it for the real browser, like taap.it.
  var ua=navigator.userAgent, inApp=/Instagram|FBAN|FBAV|TikTok|musical_ly|Snapchat/i.test(ua), ios=/iphone|ipad|ipod/i.test(ua), android=/android/i.test(ua);
  if(!inApp||(!ios&&!android))return;
  function out(web){
    return ios ? "x-safari-"+web : "intent://"+web.replace(/^https?:\/\//,"")+"#Intent;scheme=https;S.browser_fallback_url="+encodeURIComponent(web)+";end";
  }
  ["tt","x"].forEach(function(id){var a=document.getElementById(id);a.href=out(a.href)});
  location.href=out(location.href);
})();
</script>
</body></html>
